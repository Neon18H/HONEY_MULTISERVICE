name: honey_multiservice

x-honeypot-defaults: &honeypot_defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

services:
  cowrie:
    <<: *honeypot_defaults
    image: cowrie/cowrie:latest
    container_name: hp_cowrie
    ports:
      - "${COWRIE_SSH_PORT:-2222}:2222/tcp"
      - "${COWRIE_TELNET_PORT:-2223}:2223/tcp"
    volumes:
      - ./data/cowrie/logs:/cowrie/cowrie-git/var/log/cowrie
      - ./data/cowrie/var:/cowrie/cowrie-git/var/lib/cowrie
    networks:
      - honeynet_net
      - log_net
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    cpus: "1.0"
    mem_limit: 512m

  dionaea:
    <<: *honeypot_defaults
    image: dinotools/dionaea:latest
    container_name: hp_dionaea
    user: "0:0"
    ports:
      - "21:21/tcp"
      - "69:69/udp"
      - "80:80/tcp"
      - "135:135/tcp"
      - "445:445/tcp"
      - "1433:1433/tcp"
      - "1723:1723/tcp"
      - "3306:3306/tcp"
      - "5060:5060/tcp"
    volumes:
      - ./data/dionaea/logs:/opt/dionaea/var/log/dionaea
      - ./data/dionaea/downloads:/opt/dionaea/var/lib/dionaea/binaries
    networks:
      - honeynet_net
      - log_net
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    pids_limit: 256
    cpus: "1.0"
    mem_limit: 768m

  elasticpot:
    <<: *honeypot_defaults
    build:
      context: ./services/elasticpot
    image: honey/elasticpot:local
    container_name: hp_elasticpot
    ports:
      - "${ELASTICPOT_PORT:-9200}:9200/tcp"
    environment:
      ELASTICPOT_LOG_DIR: /data/logs
      ELASTICPOT_PORT: 9200
    volumes:
      - ./data/elasticpot/logs:/data/logs
    networks:
      - honeynet_net
      - log_net
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    pids_limit: 128
    cpus: "0.50"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9200/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mailoney:
    <<: *honeypot_defaults
    build:
      context: ./services/mailoney
    image: honey/mailoney:local
    container_name: hp_mailoney
    ports:
      - "${MAILONEY_SMTP_PORT:-25}:2525/tcp"
    environment:
      MAILONEY_LOG_DIR: /data/logs
      MAILONEY_PORT: 2525
    volumes:
      - ./data/mailoney/logs:/data/logs
    networks:
      - honeynet_net
      - log_net
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    pids_limit: 128
    cpus: "0.50"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',2525),3); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  conpot:
    <<: *honeypot_defaults
    build:
      context: ./services/conpot
    image: honey/conpot:local
    container_name: hp_conpot
    ports:
      - "102:1102/tcp"
      - "502:1502/tcp"
      - "16100:16100/udp"
      - "44818:44818/tcp"
    environment:
      CONPOT_LOG_DIR: /data/logs
      CONPOT_CONFIG_DIR: /data/configs
      CONPOT_S7_PORT: 1102
      CONPOT_MODBUS_PORT: 1502
      CONPOT_SNMP_PORT: 16100
      CONPOT_ENIP_PORT: 44818
    volumes:
      - ./data/conpot/logs:/data/logs
      - ./data/conpot/configs:/data/configs
    networks:
      - honeynet_net
      - log_net
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    pids_limit: 128
    cpus: "0.75"
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',44818),3); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  webtrap:
    <<: *honeypot_defaults
    build:
      context: ./services/webtrap
    image: honey/webtrap:local
    container_name: hp_webtrap
    environment:
      WEBTRAP_LOG_DIR: /data/logs
      WEBTRAP_ENABLE_HTTPS: "true"
      WEBTRAP_HTTP_PORT: 8080
      WEBTRAP_HTTPS_PORT: 8443
    ports:
      - "${WEBTRAP_HTTP_PORT:-8088}:8080/tcp"
      - "${WEBTRAP_HTTPS_PORT:-8443}:8443/tcp"
    volumes:
      - ./data/webtrap/logs:/data/logs
    networks:
      - honeynet_net
      - log_net
      - mgmt_net
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    pids_limit: 128
    cpus: "0.50"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  honeynet_net:
    driver: bridge
    name: honeynet_net
  log_net:
    driver: bridge
    internal: true
    name: log_net
  mgmt_net:
    driver: bridge
    internal: true
    name: mgmt_net
