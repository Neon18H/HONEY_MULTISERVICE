name: honey_multiservice

x-honeypot-defaults: &honeypot_defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

services:
  cowrie:
    <<: *honeypot_defaults
    image: cowrie/cowrie:latest
    container_name: hp_cowrie
    ports:
      - "${COWRIE_SSH_PORT:-2222}:2222/tcp"
      - "${COWRIE_TELNET_PORT:-2223}:2223/tcp"
    volumes:
      - ./data/cowrie/var:/cowrie/cowrie-git/var
      - ./data/cowrie/etc:/cowrie/cowrie-git/etc
      - ./data/cowrie/logs:/cowrie/cowrie-git/log
    networks:
      - honeynet_net
      - log_net
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    cpus: "1.0"
    mem_limit: 512m

  dionaea:
    <<: *honeypot_defaults
    image: dinotools/dionaea:latest
    container_name: hp_dionaea
    ports:
      - "21:21/tcp"
      - "69:69/udp"
      - "80:80/tcp"
      - "135:135/tcp"
      - "445:445/tcp"
      - "1433:1433/tcp"
      - "1723:1723/tcp"
      - "3306:3306/tcp"
      - "5060:5060/tcp"
    volumes:
      - ./data/dionaea/logs:/opt/dionaea/var/log
      - ./data/dionaea/downloads:/opt/dionaea/var/dionaea/binaries
    networks:
      - honeynet_net
      - log_net
    cpus: "1.0"
    mem_limit: 768m

  elasticpot:
    <<: *honeypot_defaults
    build:
      context: ./services/elasticpot
    image: honey/elasticpot:local
    container_name: hp_elasticpot
    ports:
      - "${ELASTICPOT_PORT:-9200}:9200/tcp"
    environment:
      ELASTICPOT_LOG_DIR: /data/logs
      ELASTICPOT_PORT: 9200
    volumes:
      - ./data/elasticpot/logs:/data/logs
    networks:
      - honeynet_net
      - log_net
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    pids_limit: 128
    cpus: "0.50"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9200/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mailoney:
    <<: *honeypot_defaults
    image: dinotools/mailoney:latest
    container_name: hp_mailoney
    ports:
      - "${MAILONEY_SMTP_PORT:-25}:25/tcp"
    volumes:
      - ./data/mailoney/logs:/var/log/mailoney
    networks:
      - honeynet_net
      - log_net
    pids_limit: 128
    cpus: "0.50"
    mem_limit: 256m

  conpot:
    <<: *honeypot_defaults
    image: ghcr.io/mushorg/conpot:latest
    container_name: hp_conpot
    ports:
      - "102:102/tcp"
      - "502:502/tcp"
      - "16100:16100/udp"
      - "44818:44818/tcp"
    volumes:
      - ./data/conpot/logs:/data/logs
      - ./data/conpot/configs:/data/config
    networks:
      - honeynet_net
      - log_net
    cpus: "1.0"
    mem_limit: 512m

  webtrap:
    <<: *honeypot_defaults
    build:
      context: ./services/webtrap
    image: honey/webtrap:local
    container_name: hp_webtrap
    environment:
      WEBTRAP_LOG_DIR: /data/logs
      WEBTRAP_ENABLE_HTTPS: "true"
      WEBTRAP_HTTP_PORT: 8080
      WEBTRAP_HTTPS_PORT: 8443
    ports:
      - "${WEBTRAP_HTTP_PORT:-8088}:8080/tcp"
      - "${WEBTRAP_HTTPS_PORT:-8443}:8443/tcp"
    volumes:
      - ./data/webtrap/logs:/data/logs
    networks:
      - honeynet_net
      - log_net
      - mgmt_net
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    pids_limit: 128
    cpus: "0.50"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  honeynet_net:
    driver: bridge
    name: honeynet_net
  log_net:
    driver: bridge
    internal: true
    name: log_net
  mgmt_net:
    driver: bridge
    internal: true
    name: mgmt_net
